name: Format, Lint, Test, and Build App

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Placeholders that pass `shared/env.ts`. Nothing in CI connects to them.
    env:
      DATABASE_URL: postgres://postgres:local123@localhost:5432/postgres
      BETTER_AUTH_SECRET: secret
      NEXT_PUBLIC_BETTER_AUTH_URL: https://example.com
      BETTER_AUTH_TRUSTED_ORIGINS: https://example.com
      GOOGLE_CLIENT_ID: id
      GOOGLE_CLIENT_SECRET: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}
          path: ${{ github.workspace }}/.next/cache

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run formatter check
        run: bun run format-check

      - name: Run linter check
        run: bun run lint

      - name: Run spell check
        run: bun run spell

      - name: Run tests
        run: bun run test

      - name: Run build
        run: bun run build
